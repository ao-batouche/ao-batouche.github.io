{% assign extension = include.path | split:'.' | last %}
{% assign media_title = include.title | default: include.alt | default: page.title %}
<figure class="media-figure">
  {% if extension == "mp4" or extension == "webm" or extension == "ogg" %}
  <video
    src="{% if include.cache_bust %}{{ include.path | relative_url | bust_file_cache }}{% else %}{{ include.path | relative_url }}{% endif %}"
    {% if include.class %}class="{{ include.class }}"{% endif %}
    aria-label="{{ media_title | escape }}" preload="metadata" playsinline
    {% if include.autoplay %}autoplay{% endif %}
    {% if include.controls %}controls{% endif %}
    {% if include.loop %}loop{% endif %}
    {% if include.muted %}muted{% endif %}
    {% if include.poster %}poster="{{ include.poster | relative_url }}"{% endif %}>
    <a href="{{ include.path | relative_url }}">Download the video</a>.
  </video>
  {% else %}
  <iframe src="{{ include.path }}" title="{{ media_title | escape }}" loading="lazy"
    {% if include.class %}class="{{ include.class }}"{% endif %}
    allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
  <p><a href="{{ include.path }}" target="_blank" rel="noopener noreferrer">Open {{ media_title | escape }} in a new tab</a>.</p>
  {% endif %}
  {%- if include.caption -%}<figcaption class="caption">{{ include.caption }}</figcaption>{%- endif %}
</figure>
